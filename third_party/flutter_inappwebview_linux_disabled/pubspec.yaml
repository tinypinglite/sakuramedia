name: flutter_inappwebview_linux
description: Disables the Linux InAppWebView implementation on systems without WPE WebKit.
version: 0.1.0-beta.1
publish_to: none

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview_platform_interface: ^1.4.0-beta.3

flutter:
  plugin:
    implements: flutter_inappwebview
    platforms:
      linux:
        pluginClass: FlutterInappwebviewLinuxPlugin
