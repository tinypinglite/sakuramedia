name: Release macOS

on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build-and-release:
    name: Build macOS dmg and publish release
    runs-on: macos-15

    env:
      DMG_NAME: sakuramedia-macos-${{ github.ref_name }}-unsigned.dmg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Cache CocoaPods
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/CocoaPods
          key: cocoapods-macos-${{ hashFiles('macos/Podfile.lock') }}
          restore-keys: cocoapods-macos-

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS release
        shell: bash
        run: |
          # 从 git tag 注入版本：v0.3.7 -> 0.3.7；pubspec 的 version 仅占位，实际以 tag 为准
          # beta tag 的预发布段不符合 CFBundleShortVersionString，平台版本号只取数字主号。
          VERSION="${GITHUB_REF_NAME#v}"
          BUILD_NAME="${VERSION%%-*}"
          flutter build macos --release --build-name="$BUILD_NAME"

      - name: Package unsigned dmg
        run: |
          mkdir -p dist
          release_dir="build/macos/Build/Products/Release"
          shopt -s nullglob
          apps=("${release_dir}"/*.app)
          shopt -u nullglob

          if [ "${#apps[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one .app in ${release_dir}, found ${#apps[@]}"
            ls -la "${release_dir}" || true
            printf 'Matched .app entries:\n'
            if [ "${#apps[@]}" -gt 0 ]; then
              printf '  %s\n' "${apps[@]}"
            else
              echo '  (none)'
            fi
            exit 1
          fi

          app_path="${apps[0]}"
          echo "Packaging app bundle: ${app_path}"

          # hdiutil 是 macOS 自带工具：.app + /Applications 软链，双击 dmg 后可拖拽安装。
          staging="$(mktemp -d)"
          cp -R "${app_path}" "${staging}/"
          ln -s /Applications "${staging}/Applications"

          # hdiutil 在 CI 上偶发 Resource busy（create-dmg / electron-builder 均做重试），这里做有界重试。
          attempt=1
          until hdiutil create -volname "SakuraMedia" -srcfolder "${staging}" -ov -format UDZO "dist/${DMG_NAME}"; do
            if [ "${attempt}" -ge 3 ]; then
              echo "::error::hdiutil create failed after ${attempt} attempts"
              rm -rf "${staging}"
              exit 1
            fi
            attempt=$((attempt + 1))
            echo "hdiutil create failed, retrying (${attempt}/3)..."
            sleep 5
          done
          rm -rf "${staging}"

          shasum -a 256 "dist/${DMG_NAME}" > "dist/${DMG_NAME}.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-${{ github.ref_name }}
          path: |
            dist/${{ env.DMG_NAME }}
            dist/${{ env.DMG_NAME }}.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: sakuramedia ${{ github.ref_name }}
          # beta 的正文用审过的 Release Notes，正式版继续叠加自动生成的变更列表。
          generate_release_notes: ${{ !contains(github.ref_name, '-') }}
          files: |
            dist/${{ env.DMG_NAME }}
            dist/${{ env.DMG_NAME }}.sha256
