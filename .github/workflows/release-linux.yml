name: Release Linux

on:
  workflow_call:
    inputs:
      publish_release:
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the Flatpak to the GitHub Release
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Linux Flatpak and publish release
    runs-on: ubuntu-latest

    env:
      FLATPAK_NAME: sakuramedia-linux-${{ github.ref_name }}-x86_64.flatpak

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev \
            libmpv-dev \
            libepoxy-dev \
            libsecret-1-dev \
            libasound2-dev \
            flatpak \
            flatpak-builder \
            patchelf

      - name: Install Flatpak runtime
        shell: bash
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive --assumeyes flathub \
            org.freedesktop.Platform//26.08 \
            org.freedesktop.Sdk//26.08

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux release
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          flutter build linux --release --build-name="$VERSION"

      - name: Bundle libmpv
        shell: bash
        run: bash packaging/flatpak/bundle-libmpv.sh build/linux/x64/release/bundle

      - name: Build Flatpak bundle
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build/flatpak
          flatpak-builder \
            --user \
            --force-clean \
            --disable-rofiles-fuse \
            --repo=build/flatpak/repo \
            --state-dir=build/flatpak/state \
            build/flatpak/build \
            packaging/flatpak/com.example.sakuramedia.yml

          mkdir -p dist
          flatpak build-bundle \
            build/flatpak/repo \
            "dist/${FLATPAK_NAME}" \
            com.example.sakuramedia \
            stable
          sha256sum "dist/${FLATPAK_NAME}" > "dist/${FLATPAK_NAME}.sha256"

      - name: Smoke test Flatpak dependencies
        shell: bash
        run: |
          set -euo pipefail

          flatpak install --user --noninteractive --assumeyes "dist/${FLATPAK_NAME}"
          output="$(
            flatpak run --command=sh com.example.sakuramedia -c \
              'LD_TRACE_LOADED_OBJECTS=1 /app/bin/sakuramedia' 2>&1
          )"
          printf '%s\n' "${output}"
          if grep -q 'not found' <<<"${output}"; then
            echo "::error::Flatpak has unresolved shared library dependencies"
            exit 1
          fi
          grep -q 'libmpv.so.2' <<<"${output}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-${{ github.ref_name }}
          path: |
            dist/${{ env.FLATPAK_NAME }}
            dist/${{ env.FLATPAK_NAME }}.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          name: sakuramedia ${{ github.ref_name }}
          # Keep release notes generation in macOS workflow only to avoid duplicate
          # "What's Changed" sections when multiple workflows publish the same tag.
          generate_release_notes: false
          files: |
            dist/${{ env.FLATPAK_NAME }}
            dist/${{ env.FLATPAK_NAME }}.sha256
