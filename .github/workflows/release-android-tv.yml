name: Release Android TV

on:
  workflow_call:
    inputs:
      publish_release:
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish APKs to the GitHub Release
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android TV APKs
    uses: ./.github/workflows/release-android.yml
    with:
      tv_mode: true
      publish_release: ${{ inputs.publish_release }}
    secrets: inherit
