name: Release Android

on:
  workflow_call:
    inputs:
      publish_release:
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish build artifacts to the GitHub Release
        required: false
        type: boolean
        default: true
permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APKs and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Install dependencies
        run: flutter pub get

      - name: Validate Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for key in ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required GitHub secret: ${key}"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Prepare Android release signing files
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p android/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/keystore/release.jks

          if [ ! -s android/keystore/release.jks ]; then
            echo "::error::Decoded keystore file is empty."
            exit 1
          fi

          {
            printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=%s\n' "keystore/release.jks"
          } > android/key.properties

      - name: Build Android release APKs
        shell: bash
        run: |
          # 从 git tag 注入版本：v0.3.7 -> 0.3.7；pubspec 的 version 仅占位，实际以 tag 为准
          # --build-number 用 run_number 保证 versionCode 单调递增
          VERSION="${GITHUB_REF_NAME#v}"
          # 按 ABI 拆包：arm64-v8a / armeabi-v7a / x86_64 各一个，避免胖包带 3 套 libmpv 到 110MB+。
          # Flutter 的 ABI 列表不含 32 位 x86，--target-platform 不传即打全部 3 个。
          # 注意 --split-per-abi 会给 versionCode 加 ABI 偏移（arm32 +1000、arm64 +2000、x86_64 +4000），
          # 之后不要再退回单 APK 发布，否则已安装用户的 versionCode 会大于新包。
          flutter build apk --release --split-per-abi \
            --build-name="$VERSION" \
            --build-number="${{ github.run_number }}"

      - name: Package release APKs
        shell: bash
        run: |
          mkdir -p dist
          for abi in armeabi-v7a arm64-v8a x86_64; do
            src="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            if [ ! -f "$src" ]; then
              echo "::error::Expected APK not found: ${src}"
              exit 1
            fi
            name="sakuramedia-android-${GITHUB_REF_NAME}-${abi}.apk"
            echo "Packaging ${src} -> dist/${name}"
            cp "$src" "dist/${name}"
            sha256sum "dist/${name}" > "dist/${name}.sha256"
          done

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          name: sakuramedia ${{ github.ref_name }}
          # Keep release notes generation in macOS workflow only to avoid duplicate
          # "What's Changed" sections when multiple workflows publish the same tag.
          generate_release_notes: false
          files: |
            dist/*.apk
            dist/*.apk.sha256
